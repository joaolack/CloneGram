services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - instagram-clone

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: instagram
      MYSQL_USER: instagram
      MYSQL_PASSWORD: instagram
      MYSQL_ROOT_PASSWORD: joaolack
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - instagram-clone

volumes:
  db_data:

networks:
  instagram-clone:
    driver: bridge  
      